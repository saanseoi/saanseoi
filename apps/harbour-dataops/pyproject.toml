[project]
name = "saanseoi-harbour-ocr"
version = "0.0.0"
description = "Pinned local OCR runtime for Harbour CLI e-Gazette ingestion"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "transformers==5.16.1",
  "accelerate==1.14.0",
  "pillow==12.3.0",
  "pytorch-triton-rocm==3.3.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }
pytorch-triton-rocm = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true
