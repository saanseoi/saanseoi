name: 'DEPLOY :: Cloudflare'

on:
  push:
    branches:
      - main
      - preview
  workflow_dispatch:

permissions:
  contents: write

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-preview:
    if: github.ref == 'refs/heads/preview'
    uses: ./.github/workflows/build.yml
    with:
      environment: 'preview'

  test-preview:
    if: github.ref == 'refs/heads/preview'
    needs: build-preview
    uses: ./.github/workflows/test.yml
    with:
      environment: 'preview'

  deploy-preview:
    name: 'DEPLOY :: Preview'
    if: github.ref == 'refs/heads/preview'
    needs: [build-preview, test-preview]
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: 'GIT :: Checkout'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 'CHECK :: Deployment Baseline'
        id: deployment-baseline
        env:
          DEPLOYMENT_TAG: 'saanseoi-deployed-preview'
        shell: bash
        run: |
          baseline_sha=$(git rev-parse --verify --quiet "refs/tags/$DEPLOYMENT_TAG^{commit}" || true)
          initial=false
          if [[ -z "$baseline_sha" ]]; then
            initial=true
            baseline_sha=$(git rev-parse --verify --quiet "$GITHUB_SHA^" || true)
            if [[ -z "$baseline_sha" ]]; then
              baseline_sha="$GITHUB_SHA"
            fi
          fi
          echo "sha=$baseline_sha" >> "$GITHUB_OUTPUT"
          echo "initial=$initial" >> "$GITHUB_OUTPUT"

      - name: 'CHECK :: Changed Workers'
        id: changed-workers
        uses: dorny/paths-filter@v4
        with:
          base: ${{ steps.deployment-baseline.outputs.sha }}
          ref: ${{ github.sha }}
          filters: |
            atlas-api:
              - 'bun.lock'
              - 'package.json'
              - 'apps/atlas-api/**'
              - 'libs/config-typescript/**'
              - 'libs/core/**'
              - 'libs/db/**'
            atlas-app:
              - 'bun.lock'
              - 'package.json'
              - 'apps/atlas-app/**'
              - 'libs/config-typescript/**'
              - 'libs/db/**'
            harbour-api:
              - 'bun.lock'
              - 'package.json'
              - 'apps/harbour-api/**'
              - 'libs/config-typescript/**'
              - 'libs/core/**'
              - 'libs/db/**'
            harbour-workers:
              - 'bun.lock'
              - 'package.json'
              - 'apps/harbour-workers/**'
              - 'libs/config-typescript/**'
              - 'libs/core/**'
              - 'libs/db/**'

      - name: 'INSTALL :: Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: 'CACHE :: Restore Dependencies'
        uses: actions/cache@v5
        id: cache-deps
        with:
          path: node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/bun.lock') }}

      - name: 'INSTALL :: Dependencies'
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: 'LINT :: D1 Migrations'
        run: bun run db:migration:lint

      - name: 'TEST :: Address Storage Maintenance'
        run: bun test scripts/address-premises/ scripts/migrate-address-premises-name.test.ts

      - name: 'CHECK :: Address Storage Maintenance'
        id: premises-maintenance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/address-premises/remote.ts check preview

      - name: 'PAUSE :: Address Storage Maintenance'
        if: steps.premises-maintenance.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/address-premises/remote.ts begin preview

      - name: 'SAVE :: Frozen Address Recovery Bookmarks'
        if: steps.premises-maintenance.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: address-premises-recovery-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/address-premises/preview/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      - name: 'MIGRATE :: D1 Preview'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run db:migration:run:preview

      - name: 'MIGRATE :: Address Data and Search'
        if: steps.premises-maintenance.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/address-premises/remote.ts apply preview

      - name: 'SYNC :: Meta Registry Preview'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run db:sync:preview:meta

      - name: 'DEPLOY :: Atlas API'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:preview
        working-directory: apps/atlas-api
        if: steps.premises-maintenance.outputs.needed == 'true' || github.event_name == 'workflow_dispatch' || steps.deployment-baseline.outputs.initial == 'true' || steps.changed-workers.outputs.atlas-api == 'true'

      - name: 'DEPLOY :: Atlas App'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:preview
        working-directory: apps/atlas-app
        if: github.event_name == 'workflow_dispatch' || steps.deployment-baseline.outputs.initial == 'true' || steps.changed-workers.outputs.atlas-app == 'true'

      - name: 'DEPLOY :: Harbour API'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:preview
        working-directory: apps/harbour-api
        if: steps.premises-maintenance.outputs.needed == 'true' || github.event_name == 'workflow_dispatch' || steps.deployment-baseline.outputs.initial == 'true' || steps.changed-workers.outputs.harbour-api == 'true'

      - name: 'RESUME :: Verified Address Storage'
        if: steps.premises-maintenance.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/address-premises/remote.ts finish preview

      - name: 'PUBLISH :: API Release Documentation'
        env:
          HARBOUR_API_KEY: ${{ secrets.HARBOUR_API_KEY }}
        run: ./bin/saanseoi docs:publish --target preview --scope apiReleaseSets

      - name: 'DEPLOY :: Harbour Workers'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:preview
        working-directory: apps/harbour-workers
        if: github.event_name == 'workflow_dispatch' || steps.deployment-baseline.outputs.initial == 'true' || steps.changed-workers.outputs.harbour-workers == 'true'

      - name: 'SAVE :: Address Maintenance Recovery Evidence'
        if: always() && steps.premises-maintenance.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: address-premises-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/address-premises/preview/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: warn

      - name: 'CHECK :: Record Deployment Baseline'
        if: success()
        env:
          DEPLOYMENT_TAG: 'saanseoi-deployed-preview'
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ref="refs/tags/$DEPLOYMENT_TAG"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$DEPLOYMENT_TAG" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$DEPLOYMENT_TAG" \
              --field sha="$GITHUB_SHA" \
              --field force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --field ref="$ref" \
              --field sha="$GITHUB_SHA" >/dev/null
          fi

  build-production:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build.yml
    with:
      environment: 'production'

  test-production:
    if: github.ref == 'refs/heads/main'
    needs: build-production
    uses: ./.github/workflows/test.yml
    with:
      environment: 'production'

  deploy-production:
    name: 'DEPLOY :: Production'
    if: github.ref == 'refs/heads/main'
    needs: [build-production, test-production]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 'GIT :: Checkout'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 'CHECK :: Deployment Baseline'
        id: deployment-baseline
        env:
          DEPLOYMENT_TAG: 'saanseoi-deployed-production'
        shell: bash
        run: |
          baseline_sha=$(git rev-parse --verify --quiet "refs/tags/$DEPLOYMENT_TAG^{commit}" || true)
          initial=false
          if [[ -z "$baseline_sha" ]]; then
            initial=true
            baseline_sha=$(git rev-parse --verify --quiet "$GITHUB_SHA^" || true)
            if [[ -z "$baseline_sha" ]]; then
              baseline_sha="$GITHUB_SHA"
            fi
          fi
          echo "sha=$baseline_sha" >> "$GITHUB_OUTPUT"
          echo "initial=$initial" >> "$GITHUB_OUTPUT"

      - name: 'CHECK :: Changed Workers'
        id: changed-workers
        uses: dorny/paths-filter@v4
        with:
          base: ${{ steps.deployment-baseline.outputs.sha }}
          ref: ${{ github.sha }}
          filters: |
            atlas-api:
              - 'bun.lock'
              - 'package.json'
              - 'apps/atlas-api/**'
              - 'libs/config-typescript/**'
              - 'libs/core/**'
              - 'libs/db/**'
            atlas-app:
              - 'bun.lock'
              - 'package.json'
              - 'apps/atlas-app/**'
              - 'libs/config-typescript/**'
              - 'libs/db/**'
            basemap-tiles:
              - 'bun.lock'
              - 'package.json'
              - 'apps/basemap-tiles/**'
              - 'libs/auth/**'
              - 'libs/basemap/**'
            basemap-viewer:
              - 'bun.lock'
              - 'package.json'
              - 'apps/basemap-viewer/**'
              - 'libs/basemap/**'
            harbour-api:
              - 'bun.lock'
              - 'package.json'
              - 'apps/harbour-api/**'
              - 'libs/config-typescript/**'
              - 'libs/core/**'
              - 'libs/db/**'
            harbour-workers:
              - 'bun.lock'
              - 'package.json'
              - 'apps/harbour-workers/**'
              - 'libs/config-typescript/**'
              - 'libs/core/**'
              - 'libs/db/**'
            telegram-discord-bridge:
              - 'bun.lock'
              - 'package.json'
              - 'apps/telegram-discord-bridge/**'
              - 'libs/config-typescript/**'

      - name: 'INSTALL :: Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: 'CACHE :: Restore Dependencies'
        uses: actions/cache@v5
        id: cache-deps
        with:
          path: node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/bun.lock') }}

      - name: 'INSTALL :: Dependencies'
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: 'LINT :: D1 Migrations'
        run: bun run db:migration:lint

      - name: 'TEST :: Address Storage Maintenance'
        run: bun test scripts/address-premises/ scripts/migrate-address-premises-name.test.ts

      - name: 'CHECK :: Address Storage Maintenance'
        id: premises-maintenance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/address-premises/remote.ts check production

      - name: 'PAUSE :: Address Storage Maintenance'
        if: steps.premises-maintenance.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/address-premises/remote.ts begin production

      - name: 'SAVE :: Frozen Address Recovery Bookmarks'
        if: steps.premises-maintenance.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: address-premises-recovery-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/address-premises/production/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      - name: 'MIGRATE :: D1 Production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run db:migration:run:production

      - name: 'MIGRATE :: Address Data and Search'
        if: steps.premises-maintenance.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/address-premises/remote.ts apply production

      - name: 'SYNC :: Meta Registry Production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run db:sync:production:meta

      - name: 'DEPLOY :: Atlas API'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:production
        working-directory: apps/atlas-api
        if: steps.premises-maintenance.outputs.needed == 'true' || github.event_name == 'workflow_dispatch' || steps.deployment-baseline.outputs.initial == 'true' || steps.changed-workers.outputs.atlas-api == 'true'

      - name: 'DEPLOY :: Atlas App'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:production
        working-directory: apps/atlas-app
        if: github.event_name == 'workflow_dispatch' || steps.deployment-baseline.outputs.initial == 'true' || steps.changed-workers.outputs.atlas-app == 'true'

      - name: 'DEPLOY :: Basemap Tiles'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy
        working-directory: apps/basemap-tiles
        if: github.event_name == 'workflow_dispatch' || steps.deployment-baseline.outputs.initial == 'true' || steps.changed-workers.outputs.basemap-tiles == 'true'

      - name: 'DEPLOY :: Basemap Viewer'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:production
        working-directory: apps/basemap-viewer
        if: github.event_name == 'workflow_dispatch' || steps.deployment-baseline.outputs.initial == 'true' || steps.changed-workers.outputs.basemap-viewer == 'true'

      - name: 'DEPLOY :: Harbour API'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:production
        working-directory: apps/harbour-api
        if: steps.premises-maintenance.outputs.needed == 'true' || github.event_name == 'workflow_dispatch' || steps.deployment-baseline.outputs.initial == 'true' || steps.changed-workers.outputs.harbour-api == 'true'

      - name: 'RESUME :: Verified Address Storage'
        if: steps.premises-maintenance.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/address-premises/remote.ts finish production

      - name: 'PUBLISH :: API Release Documentation'
        env:
          HARBOUR_API_KEY: ${{ secrets.HARBOUR_API_KEY }}
        run: ./bin/saanseoi docs:publish --target production --scope apiReleaseSets

      - name: 'DEPLOY :: Harbour Workers'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy:production
        working-directory: apps/harbour-workers
        if: github.event_name == 'workflow_dispatch' || steps.deployment-baseline.outputs.initial == 'true' || steps.changed-workers.outputs.harbour-workers == 'true'

      - name: 'DEPLOY :: Telegram Discord Bridge'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run deploy
        working-directory: apps/telegram-discord-bridge
        if:
          github.event_name == 'workflow_dispatch' ||
          steps.deployment-baseline.outputs.initial == 'true' ||
          steps.changed-workers.outputs.telegram-discord-bridge == 'true'

      - name: 'SAVE :: Address Maintenance Recovery Evidence'
        if: always() && steps.premises-maintenance.outputs.needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: address-premises-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/address-premises/production/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: warn

      - name: 'CHECK :: Record Deployment Baseline'
        if: success()
        env:
          DEPLOYMENT_TAG: 'saanseoi-deployed-production'
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ref="refs/tags/$DEPLOYMENT_TAG"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$DEPLOYMENT_TAG" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$DEPLOYMENT_TAG" \
              --field sha="$GITHUB_SHA" \
              --field force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              --field ref="$ref" \
              --field sha="$GITHUB_SHA" >/dev/null
          fi
